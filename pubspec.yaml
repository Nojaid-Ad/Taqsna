name: taqsna
description: "A modern weather application designed for Libya."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Flutter localization support
  # GetX will handle application translations/locales,
  # while this provides Flutter's localized Material/Cupertino behavior.
  flutter_localizations:
    sdk: flutter

  # Cupertino
  cupertino_icons: ^1.0.8

  # =========================
  # GetX
  # =========================
  get: ^4.7.3
  get_storage: ^2.1.1

  # =========================
  # Networking
  # =========================
  dio: ^5.11.1
  connectivity_plus: ^7.3.1

  # =========================
  # Local Database
  # =========================
  sqflite: ^2.4.2+1
  path: ^1.9.1

  # =========================
  # Internationalization
  # =========================
  intl: ^0.20.3

  # =========================
  # Models / JSON
  # =========================
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0

  # =========================
  # Animations / Loading
  # =========================
  animate_do: ^5.1.0
  skeletonizer: ^3.0.0
  loading_animation_widget: ^1.3.0
  lottie: ^3.5.1

  # =========================
  # Charts / Statistics
  # =========================
  fl_chart: ^1.2.0

  # =========================
  # Maps
  # =========================
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # =========================
  # Location
  # =========================
  geolocator: ^14.0.3

  # =========================
  # Sharing / External Links
  # =========================
  share_plus: ^13.3.0
  url_launcher: ^6.3.2

  # =========================
  # App Information
  # =========================
  package_info_plus: ^10.2.1

  # =========================
  # In-App Rating
  # =========================
  in_app_review: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # =========================
  # Code Generation
  # =========================
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true

  # =========================
  # Assets
  # =========================
  assets:
    - assets/images/cities/
    - assets/images/weather/
    - assets/lottie/
    - assets/data/

  # =========================
  # Fonts
  # =========================
  fonts:
    # Arabic
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/ar/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ar/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ar/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ar/IBMPlexSansArabic-Bold.ttf
          weight: 700

    # English
    - family: Inter
      fonts:
        - asset: assets/fonts/en/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/en/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/en/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/en/Inter_18pt-Bold.ttf
          weight: 700
